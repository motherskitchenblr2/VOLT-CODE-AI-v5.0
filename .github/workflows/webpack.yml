# .github/workflows/webpack.yml
name: Webpack CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies (npm CLI)
        run: npm ci

      - name: Build project with Webpack
        run: npm run build

      - name: Run tests
        run: npm test
