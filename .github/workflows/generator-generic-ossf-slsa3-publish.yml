name: SLSA generic generator

on:
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digests: ${{ steps.hash.outputs.digests }}

    steps:
      - uses: actions/checkout@v4

      - name: Build artifacts
        run: |
          echo "artifact1" > artifact1
          echo "artifact2" > artifact2

      - name: Generate subject for provenance
        id: hash
        run: |
          set -euo pipefail
          files=$(ls artifact*)
          echo "digests=$(sha256sum $files | base64 -w0)" >> "${GITHUB_OUTPUT}"

  provenance:
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    # ✅ Use a valid release tag (v2.0.0 is latest stable)
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      subjects: "${{ needs.build.outputs.digests }}"
      upload-assets: true

  notify-vercel:
    needs: [provenance]
    runs-on: ubuntu-latest
    steps:
      - name: Notify Vercel
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: your-org/volt_code_ai
          event-type: vercel-deploy
